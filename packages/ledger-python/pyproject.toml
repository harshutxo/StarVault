[project]
name = "starvault-ledger"
version = "0.1.0"
description = "Tamper-evident audit ledger primitives for StarVault"
requires-python = ">=3.11"
dependencies = [
  "rfc8785>=0.1.4",
  "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
